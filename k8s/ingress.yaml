apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repo-scrapper-ingress
  namespace: repo-scrapper
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - repo-scrapper.local # <--- Replace with your domain or Public IP hostname
      secretName: repo-scrapper-tls-secret
  rules:
    - host: repo-scrapper.local  # <--- Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: repo-scrapper-backend
                port:
                  number: 8000