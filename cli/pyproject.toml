[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scrapper-cli"
version = "1.2.0"
description = "Smart AI-powered GitHub repository search & interactive CLI assistant"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["github", "cli", "ai", "fastapi", "kubernetes", "scrapper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
]

[project.scripts]
repo-scrapper = "repo_scrapper_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]