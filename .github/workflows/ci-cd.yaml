name: Repo Scrapper Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  ACR_NAME: reposcrapperreg2026
  ACR_REGISTRY: reposcrapperreg2026.azurecr.io
  RESOURCE_GROUP: repo-scrapper-rg
  CLUSTER_NAME: repo-scrapper-aks
  NAMESPACE: repo-scrapper

jobs:
  lint-and-test:
    name: 🐍 Python Lint & Code Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "server/requirements.txt"

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install flake8 pytest

      - name: Lint Code with Flake8
        run: |
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: server
        run: |
          pytest server/tests

  build-and-deploy-azure:
    name: 🚀 Build, Push to ACR & Deploy to AKS
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ACR
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.ACR_REGISTRY }}/repo-scrapper-backend:latest
            ${{ env.ACR_REGISTRY }}/repo-scrapper-backend:${{ github.sha }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy Manifests to Kubernetes (AKS)
        run: |
          # Safe idempotent creation (Does not fail if namespace exists)
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Apply all ConfigMaps, Secrets, Deployment & Service manifests
          kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}

          # Update image tag to current git commit SHA
          kubectl set image deployment/repo-scrapper-backend repo-scrapper-backend=${{ env.ACR_REGISTRY }}/repo-scrapper-backend:${{ github.sha }} -n ${{ env.NAMESPACE }}

          # Trigger zero-downtime rolling restart
          kubectl rollout status deployment/repo-scrapper-backend -n ${{ env.NAMESPACE }} --timeout=120s