apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: repo-scrapper-ingress
  namespace: repo-scrapper
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: repo-scrapper.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: repo-scrapper-service
                port:
                  number: 8000