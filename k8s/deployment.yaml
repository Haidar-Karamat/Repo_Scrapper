apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-scrapper-deployment
  labels:
    app: repo-scrapper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: repo-scrapper
  template:
    metadata:
      labels:
        app: repo-scrapper
    spec:
      containers:
      - name: repo-scrapper
        image: reposcrapperreg2026.azurecr.io/repo-scrapper:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10