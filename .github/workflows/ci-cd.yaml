name: Repo Scrapper Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  RESOURCE_GROUP: repo-scrapper-rg
  CONTAINER_APP_NAME: repo-scrapper-backend

jobs:
  lint-and-test:
    name: 🐍 Python Lint & Code Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "server/requirements.txt"

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install flake8 pytest httpx

      - name: Lint Code with Flake8
        run: |
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: server
        run: |
          pytest server/tests -v

  build-and-deploy:
    name: 🚀 Build, Push to Docker Hub & Deploy to Azure Container App
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/repo-scrapper-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/repo-scrapper-backend:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Serverless Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ secrets.DOCKERHUB_USERNAME }}/repo-scrapper-backend:${{ github.sha }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          environmentVariables: |
            GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}
            GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}
            GITHUB_TOKEN=${{ secrets.GH_TOKEN }}