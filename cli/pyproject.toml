[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scrapper-cli"
version = "0.1.0"
description = "AI-powered GitHub CLI Agent for searching, cloning, and forking repositories."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "questionary>=2.0.1"
]

[project.scripts]
repo-scrapper = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_scrapper_cli*"]